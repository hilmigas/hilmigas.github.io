<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Factory AI - Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a; /* Slate 900 */
      color: #f8fafc;
    }
    
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .animated-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden;
      z-index: -1;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 10s infinite ease-in-out alternate;
    }
    
    .orb-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #3b82f6; }
    .orb-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #8b5cf6; animation-delay: -5s; }

    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(40px) scale(1.1); }
    }

    .hidden-state { display: none; }
    
    .fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

  <!-- Background Effects -->
  <div class="animated-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="w-full max-w-4xl">
    
    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center px-4 py-1.5 mb-4 rounded-full glass-panel text-sm font-medium text-blue-300">
        <span class="flex w-2 h-2 rounded-full bg-blue-400 mr-2 animate-pulse"></span>
        AI-Powered Prototype
      </div>
      <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-4">
        Course <span class="gradient-text">Factory</span>
      </h1>
      <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto">
        Transform any idea into a structured, production-ready course curriculum in seconds using our AI engine.
      </p>
    </div>

    <!-- Main Card -->
    <div class="glass-panel rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden">
      
      <!-- Input Section -->
      <div id="input-section" class="space-y-6">
        <div>
          <label for="topic" class="block text-sm font-semibold text-slate-300 mb-2">What do you want to teach?</label>
          <input type="text" id="topic" 
                 class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-5 py-4 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-lg"
                 placeholder="e.g. Advanced Python for Data Science" autocomplete="off">
        </div>
        
        <button id="generate-btn" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-blue-500/25 flex justify-center items-center gap-2 group">
          <span>Generate Curriculum</span>
          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading-section" class="hidden-state py-12 flex flex-col items-center justify-center text-center">
        <div class="relative w-20 h-20 mb-6">
          <div class="absolute inset-0 rounded-full border-4 border-slate-700"></div>
          <div class="absolute inset-0 rounded-full border-4 border-blue-500 border-t-transparent animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <svg class="w-8 h-8 text-blue-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          </div>
        </div>
        <h3 class="text-xl font-bold text-white mb-2">Analyzing Subject Matter...</h3>
        <p class="text-slate-400" id="loading-text">Synthesizing optimal learning path</p>
      </div>

      <!-- Result Section -->
      <div id="result-section" class="hidden-state">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-white flex items-center gap-2">
            <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Curriculum Ready
          </h2>
          <button id="reset-btn" class="text-slate-400 hover:text-white transition-colors text-sm font-medium">
            Start Over
          </button>
        </div>
        
        <div class="mb-4 p-4 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-200">
          <strong>Topic:</strong> <span id="display-topic" class="text-white font-semibold"></span>
        </div>

        <div class="space-y-4" id="modules-container">
          <!-- Modules will be injected here via JS -->
        </div>
      </div>
      
    </div>
    
    <!-- Footer/Return -->
    <div class="text-center mt-8">
      <a href="index.html" class="inline-flex items-center text-slate-400 hover:text-white transition-colors">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Portfolio
      </a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const inputSection = document.getElementById('input-section');
      const loadingSection = document.getElementById('loading-section');
      const resultSection = document.getElementById('result-section');
      const topicInput = document.getElementById('topic');
      const generateBtn = document.getElementById('generate-btn');
      const resetBtn = document.getElementById('reset-btn');
      const displayTopic = document.getElementById('display-topic');
      const modulesContainer = document.getElementById('modules-container');
      const loadingText = document.getElementById('loading-text');

      const loadingMessages = [
        "Synthesizing optimal learning path...",
        "Structuring lesson modules...",
        "Finalizing curriculum details..."
      ];

      generateBtn.addEventListener('click', processGeneration);
      
      topicInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') processGeneration();
      });

      resetBtn.addEventListener('click', () => {
        topicInput.value = '';
        resultSection.classList.add('hidden-state');
        inputSection.classList.remove('hidden-state');
        inputSection.classList.add('fade-in');
        setTimeout(() => inputSection.classList.remove('fade-in'), 600);
      });

      function processGeneration() {
        const topic = topicInput.value.trim();
        if (!topic) {
          topicInput.classList.add('border-red-500', 'ring-red-500');
          setTimeout(() => topicInput.classList.remove('border-red-500', 'ring-red-500'), 1000);
          return;
        }

        // Switch to loading
        inputSection.classList.add('hidden-state');
        loadingSection.classList.remove('hidden-state');
        
        let msgIndex = 0;
        loadingText.innerText = loadingMessages[0];
        const msgInterval = setInterval(() => {
          msgIndex = (msgIndex + 1) % loadingMessages.length;
          loadingText.innerText = loadingMessages[msgIndex];
        }, 800);

        // Fake AI processing delay
        setTimeout(() => {
          clearInterval(msgInterval);
          loadingSection.classList.add('hidden-state');
          showResults(topic);
        }, 2500);
      }

      function showResults(topic) {
        displayTopic.innerText = topic;
        
        // Mock data logic
        const modules = [
          {
            title: `Module 1: Foundations of ${topic}`,
            lessons: ["Introduction & Overview", "Core Terminology", "Setting Up Your Environment"]
          },
          {
            title: "Module 2: Practical Application",
            lessons: ["First Exercises", "Best Practices & Workflows", "Common Pitfalls to Avoid"]
          },
          {
            title: "Module 3: Advanced Concepts & Project",
            lessons: ["Real-world Case Studies", "Building the Final Project", "Review & Next Steps"]
          }
        ];

        modulesContainer.innerHTML = '';
        
        modules.forEach((mod, idx) => {
          const modEl = document.createElement('div');
          modEl.className = 'bg-slate-800/80 border border-slate-700 rounded-xl p-5 fade-in';
          modEl.style.animationDelay = `${idx * 0.15}s`;
          
          let lessonsHtml = mod.lessons.map(lesson => `
            <li class="flex items-start text-slate-300">
              <svg class="w-5 h-5 text-blue-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <span>${lesson}</span>
            </li>
          `).join('');

          modEl.innerHTML = `
            <h3 class="text-lg font-bold text-white mb-4 border-b border-slate-700 pb-2">${mod.title}</h3>
            <ul class="space-y-3">${lessonsHtml}</ul>
          `;
          
          modulesContainer.appendChild(modEl);
        });

        resultSection.classList.remove('hidden-state');
        resultSection.classList.add('fade-in');
        setTimeout(() => resultSection.classList.remove('fade-in'), 600);
      }
    });
  </script>
</body>
</html>
