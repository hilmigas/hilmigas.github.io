<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bigben Course Factory - AI Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bigben: {
              gold: '#c59b27',
              goldhover: '#dcb13a',
              dark: '#111111',
              panel: '#1a1a1a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #111111;
      color: #f8fafc;
      background-image: radial-gradient(circle at top, #1a1a1a 0%, #111111 100%);
      font-family: 'Inter', sans-serif;
    }
    
    .glass-panel {
      background: rgba(26, 26, 26, 0.95);
      border: 1px solid #333;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    
    .gold-text {
      color: #c59b27;
    }

    .btn-gold {
      background-color: #c59b27;
      color: #000;
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      background-color: #dcb13a;
      box-shadow: 0 0 20px rgba(197, 155, 39, 0.3);
      transform: translateY(-2px);
    }

    .hidden-state { display: none; }
    
    .fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Graphical Roadmap Styles */
    .roadmap-container {
      position: relative;
      padding-left: 2rem;
    }
    .roadmap-container::before {
      content: '';
      position: absolute;
      top: 10px;
      bottom: 0;
      left: 11px;
      width: 2px;
      background: #333;
      z-index: 1;
    }
    .roadmap-node {
      position: relative;
      margin-bottom: 2.5rem;
      z-index: 2;
    }
    .roadmap-node::before {
      content: '';
      position: absolute;
      left: -2rem;
      top: 0.25rem;
      width: 24px;
      height: 24px;
      background: #111;
      border: 3px solid #c59b27;
      border-radius: 50%;
      z-index: 2;
      box-shadow: 0 0 15px rgba(197, 155, 39, 0.3);
      transition: all 0.3s ease;
    }
    .roadmap-node:hover::before {
      background: #c59b27;
      box-shadow: 0 0 20px rgba(197, 155, 39, 0.6);
    }
    .roadmap-node:last-child {
      margin-bottom: 0;
    }
    
    .loading-ring {
      border-color: #333;
      border-top-color: #c59b27;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

  <div class="w-full max-w-4xl">
    
    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center px-4 py-1.5 mb-6 rounded glass-panel text-xs font-semibold gold-text uppercase tracking-widest border border-bigben-gold/30">
        <span class="flex w-2 h-2 rounded-full bg-bigben-gold mr-2 animate-pulse"></span>
        Precision to build the future
      </div>
      <h1 class="text-4xl md:text-5xl font-serif tracking-wide mb-4">
        BIG BEN <span class="gold-text font-bold">COURSE FACTORY</span>
      </h1>
      <p class="text-gray-400 text-lg max-w-2xl mx-auto">
        Intelligently structure training programs in seconds. Enter a topic to generate a comprehensive graphical roadmap.
      </p>
    </div>

    <!-- Main Card -->
    <div class="glass-panel rounded-sm p-6 md:p-10 relative overflow-hidden">
      
      <!-- Input Section -->
      <div id="input-section" class="space-y-6">
        <div>
          <label for="topic" class="block text-sm font-semibold text-gray-300 mb-2 uppercase tracking-wide">Training Course Topic</label>
          <input type="text" id="topic" 
                 class="w-full bg-[#111] border border-gray-700 rounded p-4 text-white placeholder-gray-600 focus:outline-none focus:border-bigben-gold focus:ring-1 focus:ring-bigben-gold transition-all text-lg"
                 placeholder="e.g. Sustainable Local Development" autocomplete="off">
        </div>
        
        <button id="generate-btn" 
                class="w-full btn-gold font-bold py-4 rounded flex justify-center items-center gap-2 group uppercase tracking-wider text-sm">
          <span>Generate Roadmap</span>
          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>

      <!-- Loading State -->
      <div id="loading-section" class="hidden-state py-12 flex flex-col items-center justify-center text-center">
        <div class="relative w-16 h-16 mb-6">
          <div class="absolute inset-0 rounded-full border-4 loading-ring animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <svg class="w-6 h-6 gold-text animate-pulse" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path></svg>
          </div>
        </div>
        <h3 class="text-xl font-bold text-white mb-2 font-serif uppercase tracking-wider">Structuring Program...</h3>
        <p class="text-gray-400" id="loading-text">Analyzing training objectives</p>
      </div>

      <!-- Result Section -->
      <div id="result-section" class="hidden-state">
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
          <h2 class="text-2xl font-serif font-bold text-white flex items-center gap-3 uppercase tracking-wide">
            <svg class="w-6 h-6 gold-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Generated Roadmap
          </h2>
          <button id="reset-btn" class="text-gray-400 hover:text-bigben-gold transition-colors text-xs font-bold uppercase tracking-wider flex items-center gap-1 border border-gray-700 hover:border-bigben-gold rounded px-3 py-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Build Another
          </button>
        </div>
        
        <div class="mb-8 p-5 rounded bg-[#111] border border-bigben-gold/30 flex items-center gap-4">
          <div class="w-12 h-12 rounded bg-bigben-gold/10 flex items-center justify-center shrink-0">
             <svg class="w-6 h-6 gold-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
          </div>
          <div>
            <span class="text-gray-400 text-xs uppercase tracking-wide font-bold">Target Training Program</span>
            <div id="display-topic" class="text-white font-bold text-xl mt-1 font-serif"></div>
          </div>
        </div>

        <!-- The Visual Roadmap -->
        <div class="roadmap-container" id="modules-container">
          <!-- Modules will be injected here via JS -->
        </div>
        
      </div>
      
    </div>
    
    <!-- Footer/Return -->
    <div class="text-center mt-12">
      <a href="index.html" class="inline-flex items-center text-gray-500 hover:text-white transition-colors uppercase tracking-wider text-xs font-bold">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Return to Portfolio
      </a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const inputSection = document.getElementById('input-section');
      const loadingSection = document.getElementById('loading-section');
      const resultSection = document.getElementById('result-section');
      const topicInput = document.getElementById('topic');
      const generateBtn = document.getElementById('generate-btn');
      const resetBtn = document.getElementById('reset-btn');
      const displayTopic = document.getElementById('display-topic');
      const modulesContainer = document.getElementById('modules-container');
      const loadingText = document.getElementById('loading-text');

      const loadingMessages = [
        "Analyzing training objectives...",
        "Structuring learning phases...",
        "Drafting curriculum milestones...",
        "Finalizing graphical roadmap..."
      ];

      generateBtn.addEventListener('click', processGeneration);
      
      topicInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') processGeneration();
      });

      resetBtn.addEventListener('click', () => {
        topicInput.value = '';
        resultSection.classList.add('hidden-state');
        inputSection.classList.remove('hidden-state');
        inputSection.classList.add('fade-in');
        setTimeout(() => inputSection.classList.remove('fade-in'), 600);
      });

      function processGeneration() {
        const topic = topicInput.value.trim();
        if (!topic) {
          topicInput.classList.add('border-red-500', 'ring-red-500');
          setTimeout(() => topicInput.classList.remove('border-red-500', 'ring-red-500'), 1000);
          return;
        }

        // Switch to loading
        inputSection.classList.add('hidden-state');
        loadingSection.classList.remove('hidden-state');
        
        let msgIndex = 0;
        loadingText.innerText = loadingMessages[0];
        const msgInterval = setInterval(() => {
          msgIndex = (msgIndex + 1) % loadingMessages.length;
          loadingText.innerText = loadingMessages[msgIndex];
        }, 600);

        // Fake AI processing delay
        setTimeout(() => {
          clearInterval(msgInterval);
          loadingSection.classList.add('hidden-state');
          showResults(topic);
        }, 2500);
      }

      function showResults(topic) {
        displayTopic.innerText = topic;
        
        // Mock data logic tailored to a "Training Center"
        const modules = [
          {
            title: `Phase 1: Foundations of ${topic}`,
            duration: "Day 1-2",
            lessons: ["Introduction & Key Concepts", "Industry Standards & Frameworks", "Initial Assessment"]
          },
          {
            title: "Phase 2: Strategic Application",
            duration: "Day 3-4",
            lessons: ["Real-world Case Studies", "Best Practices Implementation", "Interactive Workshops"]
          },
          {
            title: "Phase 3: Mastery & Certification",
            duration: "Day 5",
            lessons: ["Final Project Development", "Performance Evaluation", "Certification Readiness"]
          }
        ];

        modulesContainer.innerHTML = '';
        
        modules.forEach((mod, idx) => {
          const modEl = document.createElement('div');
          modEl.className = 'roadmap-node fade-in';
          modEl.style.animationDelay = `${idx * 0.15}s`;
          
          let lessonsHtml = mod.lessons.map(lesson => `
            <li class="flex items-start text-gray-300 text-sm">
              <svg class="w-4 h-4 gold-text mr-2 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              <span>${lesson}</span>
            </li>
          `).join('');

          modEl.innerHTML = `
            <div class="bg-[#1a1a1a] border border-gray-800 rounded p-5 hover:border-bigben-gold/50 transition-colors ml-4">
              <div class="flex justify-between items-start mb-3">
                <h3 class="text-lg font-serif font-bold text-white">${mod.title}</h3>
                <span class="text-xs font-bold uppercase tracking-wider text-black bg-bigben-gold px-2 py-1 rounded-sm">${mod.duration}</span>
              </div>
              <ul class="space-y-2 mt-4 border-t border-gray-800 pt-3">${lessonsHtml}</ul>
            </div>
          `;
          
          modulesContainer.appendChild(modEl);
        });

        resultSection.classList.remove('hidden-state');
        resultSection.classList.add('fade-in');
        setTimeout(() => resultSection.classList.remove('fade-in'), 600);
      }
    });
  </script>
</body>
</html>
